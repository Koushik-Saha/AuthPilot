name: AuthPilot Production Deploy

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-[#version](file:///Users/koushiksaha/Desktop/PersonalProject/AuthPilot/package.json#L1-L76): '20'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Build Test
        run: npx tsc --noEmit

      - name: Run Jest Unit & Integration Tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm test

      - name: Run Pre-Deploy Verification Checklist
        run: bash scripts/pre-deploy-checklist.sh

      - name: Deploy to Aptible Production
        if: success()
        env:
          APTIBLE_API_KEY: ${{ secrets.APTIBLE_API_KEY }}
        run: |
          echo "Deploying AuthPilot to Aptible Production Container..."
